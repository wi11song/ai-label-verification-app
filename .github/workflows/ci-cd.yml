name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: System libraries for OpenCV
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgl1 libglib2.0-0

      - name: Install dependencies
        run: pip install ".[dev]"

      - name: Tests
        run: pytest -q

  # Build the image, smoke test it, and publish to GHCR on main.
  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: labelcheck:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container
        run: docker run -d --name app -p 8000:8000 --cpus 2 --memory 4g labelcheck:ci

      - name: Smoke test
        run: bash scripts/smoke_test.sh http://localhost:8000

      - name: Container logs
        if: always()
        run: docker logs app || true

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          IMAGE_LC="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          for tag in "sha-${GITHUB_SHA}" latest; do
            docker tag labelcheck:ci "${IMAGE_LC}:${tag}"
            docker push "${IMAGE_LC}:${tag}"
          done
