<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alcohol Label Check</title>
  <style>
    :root {
      --ink: #1c2430;
      --muted: #3d4a5c;
      --navy: #16324f;
      --line: #d5dbe3;
      --bg: #f3f5f8;
      --pass: #0f7a45;
      --pass-bg: #e8f6ee;
      --fail: #b42318;
      --fail-bg: #fdeceb;
      --review: #8a5a00;
      --review-bg: #fff6e0;
      --unread: #3d4a5c;
      --unread-bg: #eef1f5;
      --error: #9a3412;
      --error-bg: #fff1e8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      font-size: 1.125rem;
      line-height: 1.45;
      color: var(--ink);
      background: var(--bg);
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      background: var(--navy);
      color: white;
      padding: 1rem 1.5rem;
    }
    header h1 { margin: 0; font-size: 1.6rem; }
    header a.home { color: white; text-decoration: none; }
    nav { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    nav a {
      color: white;
      text-decoration: none;
      font-weight: 700;
      border: 2px solid white;
      border-radius: 999px;
      padding: 0.45rem 0.9rem;
    }
    nav a[aria-current="page"] { background: white; color: var(--navy); }
    main { max-width: 56rem; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
    .card {
      background: white;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1.25rem;
    }
    form.card { margin-top: 1.25rem; }
    form h2, .card h2 { margin: 0 0 0.5rem; font-size: 1.4rem; }
    .intro { margin: 0 0 0.5rem; }
    label { display: block; font-weight: 700; margin: 1.1rem 0 0.35rem; }
    .hint { font-weight: 400; color: var(--muted); }
    input[type="text"], input[type="file"], textarea {
      width: 100%;
      font: inherit;
      padding: 0.75rem;
      border: 2px solid #8b97a8;
      border-radius: 8px;
      background: white;
    }
    textarea { min-height: 7rem; resize: vertical; }
    button, a.action {
      margin-top: 1.4rem;
      width: 100%;
      min-height: 3.4rem;
      font: inherit;
      font-weight: 700;
      color: white;
      background: var(--navy);
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    a.action.inline {
      width: auto;
      min-height: 0;
      margin-top: 0;
      padding: 0.45rem 0.8rem;
      background: white;
      color: var(--navy);
      border: 2px solid var(--navy);
    }
    button:hover, a.action:hover { background: #0f2438; }
    a.action.inline:hover { background: #eef3f8; }
    button:focus, input:focus, textarea:focus, a:focus {
      outline: 3px solid #f5b942;
      outline-offset: 2px;
    }
    .banner {
      border: 2px solid;
      border-radius: 12px;
      padding: 1rem 1.25rem;
      margin-bottom: 1.25rem;
    }
    .banner h2 { margin: 0 0 0.35rem; font-size: 1.7rem; }
    .banner p { margin: 0; }
    .pass { color: var(--pass); background: var(--pass-bg); border-color: var(--pass); }
    .fail { color: var(--fail); background: var(--fail-bg); border-color: var(--fail); }
    .needs_review { color: var(--review); background: var(--review-bg); border-color: var(--review); }
    .error, .queued, .running { color: var(--error); background: var(--error-bg); border-color: var(--error); }
    .queued, .running { color: var(--unread); background: var(--unread-bg); border-color: var(--unread); }
    .table-wrap { overflow-x: auto; margin-top: 0.5rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      text-align: left;
      vertical-align: top;
      padding: 0.75rem 0.6rem;
      border-bottom: 1px solid var(--line);
    }
    table.fields { min-width: 46rem; }
    thead th {
      font-size: 0.8rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
    }
    .field-mismatch td:first-child, .field-mismatch th:first-child { box-shadow: inset 4px 0 0 var(--fail); }
    .pill {
      display: inline-block;
      font-weight: 700;
      white-space: nowrap;
      border: 2px solid currentColor;
      border-radius: 999px;
      padding: 0.15rem 0.7rem;
    }
    .pill.match, .pill.pass { color: var(--pass); background: var(--pass-bg); }
    .pill.mismatch, .pill.fail { color: var(--fail); background: var(--fail-bg); }
    .pill.needs_review { color: var(--review); background: var(--review-bg); }
    .pill.unreadable, .pill.queued, .pill.running { color: var(--unread); background: var(--unread-bg); }
    .pill.error { color: var(--error); background: var(--error-bg); }
    .note, .saved, details { margin: 1rem 0 0; }
    .note, .saved { color: var(--muted); }
    details summary { font-weight: 700; cursor: pointer; }
    details ol { margin: 0.5rem 0 0; padding-left: 1.4rem; }
    .counts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(8.5rem, 1fr));
      gap: 0.75rem;
      margin: 1rem 0;
    }
    .count {
      background: white;
      border: 2px solid var(--line);
      border-radius: 12px;
      padding: 0.8rem;
    }
    .count strong { display: block; font-size: 1.8rem; }
    .count.pass { border-color: var(--pass); }
    .count.fail { border-color: var(--fail); }
    .count.needs_review { border-color: var(--review); }
    .count.error { border-color: var(--error); }
    .progress { height: 0.7rem; background: #e6ebf2; border-radius: 999px; overflow: hidden; }
    .progress span { display: block; height: 100%; background: var(--navy); }
  </style>
</head>
<body>
  <header>
    <h1><a class="home" href="/">Alcohol Label Check</a></h1>
    <nav>
      <a href="/" {% if page == "single" %}aria-current="page"{% endif %}>Check one label</a>
      <a href="/batch" {% if page == "batch" %}aria-current="page"{% endif %}>Check many labels</a>
    </nav>
  </header>
  <main>
    {% block main %}{% endblock %}
  </main>
</body>
</html>
