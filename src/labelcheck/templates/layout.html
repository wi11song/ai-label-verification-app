<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alcohol Label Check</title>
  <style>
    :root {
      --ink: #1c2430;
      --muted: #3d4a5c;
      --navy: #16324f;
      --line: #d5dbe3;
      --bg: #f3f5f8;
      --pass: #0f7a45;
      --pass-bg: #e8f6ee;
      --fail: #b42318;
      --fail-bg: #fdeceb;
      --review: #8a5a00;
      --review-bg: #fff6e0;
      --unread: #3d4a5c;
      --unread-bg: #eef1f5;
      --error: #9a3412;
      --error-bg: #fff1e8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      font-size: 1.125rem;
      line-height: 1.45;
      color: var(--ink);
      background: var(--bg);
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      background: var(--navy);
      color: white;
      padding: 1rem 1.5rem;
    }
    header h1 { margin: 0; font-size: 1.6rem; }
    header a.home { color: white; text-decoration: none; }
    nav { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    nav a {
      color: white;
      text-decoration: none;
      font-weight: 700;
      border: 2px solid white;
      border-radius: 999px;
      padding: 0.45rem 0.9rem;
    }
    nav a[aria-current="page"] { background: white; color: var(--navy); }
    main { max-width: 56rem; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
    main:has(.workspace) { max-width: 76rem; }
    .workspace {
      display: grid;
      gap: 1.25rem;
      align-items: start;
    }
    @media (min-width: 1100px) {
      .workspace {
        grid-template-columns: minmax(22rem, 30rem) minmax(0, 1fr);
        align-items: stretch;
        min-height: calc(100vh - 5.5rem);
        max-height: calc(100vh - 5.5rem);
      }
      .form-panel {
        overflow-y: auto;
        max-height: calc(100vh - 5.5rem);
        align-self: start;
      }
      .outcome {
        overflow-y: auto;
        max-height: calc(100vh - 5.5rem);
        align-self: start;
        position: sticky;
        top: 0;
      }
    }
    @media (max-width: 1099px) {
      .outcome { order: -1; }
    }
    .card {
      background: white;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1.25rem;
    }
    .step + .step { margin-top: 1.5rem; }
    .step h2, .examples h2 {
      display: flex;
      align-items: center;
      gap: 0.55rem;
    }
    .step-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.7rem;
      height: 1.7rem;
      border-radius: 999px;
      background: var(--navy);
      color: white;
      font-size: 1rem;
    }
    .drop {
      margin-top: 0.35rem;
      padding: 0.85rem;
      border: 2px dashed #8b97a8;
      border-radius: 8px;
      background: #f8fafc;
    }
    .drop.drag { border-color: var(--navy); background: #eef3f8; }
    .drop-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
    }
    .drop input[type="file"] {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }
    label.choose {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      min-height: 2.6rem;
      padding: 0.4rem 0.9rem;
      font-weight: 700;
      color: var(--navy);
      background: white;
      border: 2px solid var(--navy);
      border-radius: 8px;
      cursor: pointer;
    }
    label.choose:hover { background: #eef3f8; }
    .drop .hint { margin: 0; }
    .preview {
      position: relative;
      display: inline-block;
      margin-top: 0.75rem;
    }
    .preview[hidden] { display: none !important; }
    .preview img {
      display: block;
      max-width: 7.5rem;
      max-height: 9rem;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: white;
    }
    button.clear {
      position: absolute;
      top: -0.45rem;
      right: -0.45rem;
      width: 1.6rem;
      min-height: 1.6rem;
      margin: 0;
      padding: 0;
      border-radius: 999px;
      background: var(--fail);
      font-size: 1.1rem;
      line-height: 1;
    }
    button.clear:hover { background: #8f1b14; }
    .pair {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }
    @media (max-width: 640px) {
      .pair { grid-template-columns: 1fr; }
    }
    details.more { margin-top: 0.5rem; }
    details.more summary { font-weight: 700; cursor: pointer; }
    .batch-format { margin: 1rem 0 1.25rem; }
    .batch-format h3 { margin: 0 0 0.5rem; font-size: 1.15rem; }
    .batch-format ul {
      margin: 0 0 0.75rem;
      padding-left: 1.25rem;
      color: var(--muted);
    }
    .batch-format li + li { margin-top: 0.35rem; }
    .examples { margin-top: 1.5rem; padding-top: 0.25rem; }
    .example-list { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.6rem; }
    button.example {
      width: auto;
      min-height: 2.4rem;
      margin: 0;
      padding: 0.35rem 0.75rem;
      font-size: 0.95rem;
      color: var(--navy);
      background: white;
      border: 2px solid var(--navy);
    }
    button.example:hover, button.example[aria-pressed="true"] { background: #eef3f8; }
    button.example[aria-pressed="true"] { background: var(--navy); color: white; }
    .outcome-empty p { margin: 0; color: var(--muted); }
    form h2, .card h2 { margin: 0 0 0.5rem; font-size: 1.4rem; }
    .intro { margin: 0 0 0.5rem; }
    label { display: block; font-weight: 700; margin: 1.1rem 0 0.35rem; }
    .hint { font-weight: 400; color: var(--muted); }
    input[type="text"], input[type="file"], textarea {
      width: 100%;
      font: inherit;
      padding: 0.75rem;
      border: 2px solid #8b97a8;
      border-radius: 8px;
      background: white;
    }
    textarea { min-height: 7rem; resize: vertical; }
    button, a.action {
      margin-top: 1.4rem;
      width: 100%;
      min-height: 3.4rem;
      font: inherit;
      font-weight: 700;
      color: white;
      background: var(--navy);
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    a.action.inline {
      width: auto;
      min-height: 0;
      margin-top: 0;
      padding: 0.45rem 0.8rem;
      background: white;
      color: var(--navy);
      border: 2px solid var(--navy);
    }
    button:hover, a.action:hover { background: #0f2438; }
    a.action.inline:hover { background: #eef3f8; }
    button:focus, input:focus, textarea:focus, a:focus {
      outline: 3px solid #f5b942;
      outline-offset: 2px;
    }
    .banner {
      border: 2px solid;
      border-radius: 12px;
      padding: 1rem 1.25rem;
      margin-bottom: 1.25rem;
    }
    .banner h2 { margin: 0 0 0.35rem; font-size: 1.7rem; }
    .banner p { margin: 0; }
    .pass { color: var(--pass); background: var(--pass-bg); border-color: var(--pass); }
    .fail { color: var(--fail); background: var(--fail-bg); border-color: var(--fail); }
    .needs_review { color: var(--review); background: var(--review-bg); border-color: var(--review); }
    .error, .queued, .running { color: var(--error); background: var(--error-bg); border-color: var(--error); }
    .queued, .running { color: var(--unread); background: var(--unread-bg); border-color: var(--unread); }
    .field-section { margin-top: 1.25rem; }
    .field-section h3 {
      margin: 0 0 0.35rem;
      font-size: 1.05rem;
      color: var(--muted);
      font-weight: 700;
    }
    .table-wrap { overflow-x: auto; margin-top: 0.35rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      text-align: left;
      vertical-align: top;
      padding: 0.75rem 0.6rem;
      border-bottom: 1px solid var(--line);
    }
    table.fields { table-layout: fixed; width: 100%; min-width: 0; }
    table.fields .col-field { width: 8.5rem; }
    table.fields .col-application { width: 35%; }
    table.fields .col-label { width: 35%; }
    table.fields .col-result { width: 7.5rem; }
    table.fields th,
    table.fields td { overflow-wrap: anywhere; word-break: break-word; }
    thead th {
      font-size: 0.8rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
    }
    .field-mismatch td:first-child, .field-mismatch th:first-child { box-shadow: inset 4px 0 0 var(--fail); }
    tr.field-why td {
      padding-top: 0;
      padding-bottom: 0.85rem;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.98rem;
    }
    tr.field-why details { margin: 0; }
    tr.field-why summary {
      font-weight: 600;
      color: var(--muted);
      list-style: none;
    }
    tr.field-why summary::-webkit-details-marker { display: none; }
    tr.field-why summary::before {
      content: "▸ ";
      display: inline;
    }
    tr.field-why details[open] summary::before { content: "▾ "; }
    tr.field-why p { margin: 0.35rem 0 0; color: var(--ink); }
    .pill {
      display: inline-block;
      font-weight: 700;
      white-space: nowrap;
      border: 2px solid currentColor;
      border-radius: 999px;
      padding: 0.15rem 0.7rem;
    }
    .pill.match, .pill.pass { color: var(--pass); background: var(--pass-bg); }
    .pill.mismatch, .pill.fail { color: var(--fail); background: var(--fail-bg); }
    .pill.needs_review { color: var(--review); background: var(--review-bg); }
    .pill.unreadable, .pill.queued, .pill.running { color: var(--unread); background: var(--unread-bg); }
    .pill.not_provided { color: var(--muted); background: var(--unread-bg); border-color: #8b97a8; }
    .pill.error { color: var(--error); background: var(--error-bg); }
    .note, .saved, details { margin: 1rem 0 0; }
    .note, .saved { color: var(--muted); }
    .outcome .action.inline { margin-top: 1rem; }
    details summary { font-weight: 700; cursor: pointer; }
    details ol { margin: 0.5rem 0 0; padding-left: 1.4rem; }
    .counts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(8.5rem, 1fr));
      gap: 0.75rem;
      margin: 1rem 0;
    }
    .count {
      background: white;
      border: 2px solid var(--line);
      border-radius: 12px;
      padding: 0.8rem;
    }
    .count strong { display: block; font-size: 1.8rem; }
    .count.pass { border-color: var(--pass); }
    .count.fail { border-color: var(--fail); }
    .count.needs_review { border-color: var(--review); }
    .count.error { border-color: var(--error); }
    .progress { height: 0.7rem; background: #e6ebf2; border-radius: 999px; overflow: hidden; }
    .progress span { display: block; height: 100%; background: var(--navy); }
    .item-detail {
      display: grid;
      gap: 1.25rem;
      align-items: start;
    }
    @media (min-width: 900px) {
      .item-detail { grid-template-columns: minmax(14rem, 22rem) minmax(0, 1fr); }
    }
    .item-photo h2 { margin: 0 0 0.75rem; }
    .label-photo {
      display: block;
      width: 100%;
      max-width: 22rem;
      height: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: white;
    }
    .result-photo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      margin: 0 0 1.25rem;
    }
    .result-photo .label-photo {
      width: auto;
      max-width: min(100%, 14rem);
      max-height: 12rem;
      object-fit: contain;
    }
    button.photo-trigger {
      margin: 0;
      width: auto;
      min-height: 0;
      padding: 0;
      background: transparent;
      border: 0;
      border-radius: 8px;
      cursor: zoom-in;
    }
    button.photo-trigger:hover { background: transparent; }
    button.photo-enlarge {
      margin: 0;
      width: auto;
      min-height: 0;
      padding: 0.35rem 0.75rem;
      font-size: 0.95rem;
      color: var(--navy);
      background: white;
      border: 2px solid var(--navy);
    }
    button.photo-enlarge:hover { background: #eef3f8; }
    dialog.lightbox {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1rem;
      max-width: min(96vw, 48rem);
      background: white;
    }
    dialog.lightbox::backdrop { background: rgba(22, 50, 79, 0.55); }
    dialog.lightbox img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 80vh;
      object-fit: contain;
    }
    dialog.lightbox form { display: flex; justify-content: flex-end; margin: 0 0 0.75rem; }
    button.lightbox-close {
      margin: 0;
      width: auto;
      min-height: 0;
      padding: 0.35rem 0.75rem;
      font-size: 0.95rem;
      color: var(--navy);
      background: white;
      border: 2px solid var(--navy);
    }
    button.lightbox-close:hover { background: #eef3f8; }
  </style>
</head>
<body>
  <header>
    <h1><a class="home" href="/">Alcohol Label Check</a></h1>
    <nav>
      <a href="/" {% if page == "single" %}aria-current="page"{% endif %}>Check one label</a>
      <a href="/batch" {% if page == "batch" %}aria-current="page"{% endif %}>Check many labels</a>
    </nav>
  </header>
  <main>
    {% block main %}{% endblock %}
  </main>
</body>
</html>
